; Local build for the Wokwi prototype target.
; The repo keeps the Wokwi layout (sketch.ino at the root, plant in chip/), so
; src_dir points at the root and the filter picks out just the firmware --
; chip/chip.chip.c is a Wokwi custom-chip plugin and does not build for AVR.
[platformio]
src_dir = .

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_src_filter = +<sketch.ino.cpp>
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
